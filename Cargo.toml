[workspace]
resolver = "2"
members = ["crates/core", "crates/worker"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# metrics va en 0.23: es la version que usa metrics-exporter-prometheus 0.15.
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
redis = { version = "1", features = ["tokio-comp", "streams"] }
hostname = "0.4"
thiserror = "1"
backoff = { version = "0.4", features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[workspace.lints.clippy]
# S0-P3-02: sin unwrap/expect en codigo de produccion
unwrap_used = "deny"
expect_used = "deny"
