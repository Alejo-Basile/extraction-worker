[workspace]
resolver = "2"
members = ["crates/core", "crates/worker"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# metrics va en 0.23: es la version que usa metrics-exporter-prometheus 0.15.
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

[workspace.lints.clippy]
# S0-P3-02: sin unwrap/expect en codigo de produccion
unwrap_used = "deny"
expect_used = "deny"
