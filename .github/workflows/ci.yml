name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La toolchain sale de rust-toolchain.toml (rustfmt + clippy incluidos)
      - name: install toolchain
        run: rustup show

      # Cache de dependencias (S0-P1-05)
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # S0-P3-02: clippy con warnings como error; unwrap/expect denegados
      # via [workspace.lints.clippy] en Cargo.toml.
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      # CI falla ante dependencias con vulnerabilidad conocida
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit
          # Ignorar RUSTSEC-2026-0258: h2 0.3.27 transitivo via actix-http 3.19
          # Se levantará cuando actix-http migre a h2 0.4
          cargo audit --ignore RUSTSEC-2026-0258

      # Licencias y duplicados de dependencias
      - name: cargo deny
        run: |
          cargo install --locked cargo-deny
          cargo deny check bans licenses advisories
