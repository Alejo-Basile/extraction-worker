name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La toolchain sale de rust-toolchain.toml (rustfmt + clippy incluidos)
      - name: install toolchain
        run: rustup show

      # Cache de dependencias (S0-P1-05)
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # S0-P3-02: clippy con warnings como error; unwrap/expect denegados
      # via [workspace.lints.clippy] en Cargo.toml.
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      # CI falla ante dependencias con vulnerabilidad conocida
      - name: cargo audit
        run: |
          cargo install --locked --force cargo-audit
          cargo audit --ignore RUSTSEC-2026-0258 --ignore RUSTSEC-2026-0346 --ignore RUSTSEC-2026-0347 --ignore RUSTSEC-2026-0348 --ignore RUSTSEC-2026-0349 --ignore RUSTSEC-2026-0382 --ignore RUSTSEC-2026-0384 --ignore RUSTSEC-2025-0012 --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2026-0192

      # Licencias y duplicados de dependencias
      - name: cargo deny
        run: |
          cargo install --locked --force cargo-deny
          cargo deny check bans licenses advisories

  integration:
    # Tests de integracion contra Redis y MinIO reales (S1-P3-04, S2-P3-01/07):
    # los #[ignore] corren solo aqui y en local (ver crates/worker/tests y
    # labs/dev-stack.md para el stack completo de desarrollo).
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # --- Stack Sentinel (T-08): master + replica + 3 sentinels ----------
      # Topologia para el IT de failover (tests/sentinel_it.rs). Sin
      # password (credenciales dev) y con `protected-mode no`: es un stack
      # descartable del job. Los sentinels generan su conf con `sh -c`
      # (Sentinel exige un config file en disco) y esperan a resolver
      # `redis-master` por DNS antes de arrancar, asi el orden de creacion
      # de los servicios no importa. Se anuncian IPs (sin
      # announce-hostnames): el test corre en el host y las alcanza via la
      # red bridge de Docker en Linux.
      redis-master:
        image: redis:7-alpine
        ports:
          - 6381:6379
        command: redis-server --port 6379 --protected-mode no
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis-replica:
        image: redis:7-alpine
        ports:
          - 6382:6379
        command: redis-server --port 6379 --protected-mode no --replicaof redis-master 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      sentinel-1:
        image: redis:7-alpine
        ports:
          - 26379:26379
        command: >-
          sh -c "while ! getent hosts redis-master >/dev/null 2>&1; do sleep 1; done;
          printf '%s\n' 'port 26379' 'dir /tmp' 'protected-mode no'
          'sentinel resolve-hostnames yes' 'sentinel monitor myprimary redis-master 6379 2'
          'sentinel down-after-milliseconds myprimary 5000'
          'sentinel failover-timeout myprimary 10000' 'sentinel parallel-syncs myprimary 1'
          > /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"
        options: >-
          --health-cmd "redis-cli -p 26379 ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
      sentinel-2:
        image: redis:7-alpine
        ports:
          - 26380:26379
        command: >-
          sh -c "while ! getent hosts redis-master >/dev/null 2>&1; do sleep 1; done;
          printf '%s\n' 'port 26379' 'dir /tmp' 'protected-mode no'
          'sentinel resolve-hostnames yes' 'sentinel monitor myprimary redis-master 6379 2'
          'sentinel down-after-milliseconds myprimary 5000'
          'sentinel failover-timeout myprimary 10000' 'sentinel parallel-syncs myprimary 1'
          > /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"
        options: >-
          --health-cmd "redis-cli -p 26379 ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
      sentinel-3:
        image: redis:7-alpine
        ports:
          - 26381:26379
        command: >-
          sh -c "while ! getent hosts redis-master >/dev/null 2>&1; do sleep 1; done;
          printf '%s\n' 'port 26379' 'dir /tmp' 'protected-mode no'
          'sentinel resolve-hostnames yes' 'sentinel monitor myprimary redis-master 6379 2'
          'sentinel down-after-milliseconds myprimary 5000'
          'sentinel failover-timeout myprimary 10000' 'sentinel parallel-syncs myprimary 1'
          > /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"
        options: >-
          --health-cmd "redis-cli -p 26379 ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
      minio:
        # MinIO retiro sus imagenes oficiales upstream; bitnamilegacy es la
        # ultima via publica (misma eleccion que labs/docker-compose.yml).
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: worker-dev
          MINIO_ROOT_PASSWORD: worker-dev-secret
          MINIO_DEFAULT_BUCKETS: raw-pdfs,extracted-txt
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: rustup show

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: start mongo (rs0 + auth + rol del worker, ADR-0006)
        run: |
          docker run -d --name mongo -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=root \
            -e MONGO_INITDB_ROOT_PASSWORD=worker-dev-root \
            mongo:7 \
            bash -c 'if [ ! -f /data/db/keyfile ]; then openssl rand -base64 75 > /data/db/keyfile; fi; chmod 400 /data/db/keyfile; exec docker-entrypoint.sh mongod --replSet rs0 --auth --keyFile /data/db/keyfile --bind_ip_all'
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet -u root -p worker-dev-root --authenticationDatabase admin --eval 'try { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}) } catch (e) { print(e.message) }' && break || sleep 2
          done
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet -u root -p worker-dev-root --authenticationDatabase admin --eval 'try { db.hello().isWritablePrimary } catch (e) { false }' | grep -q true && break || sleep 2
          done
          docker exec mongo mongosh --quiet -u root -p worker-dev-root --authenticationDatabase admin --eval '
            const app = db.getSiblingDB("app");
            try { app.createCollection("documents") } catch (e) { print(e.message) }
            try { app.createRole({role: "workerUpdateDocuments", privileges: [{resource: {db: "app", collection: "documents"}, actions: ["update"]}], roles: []}) } catch (e) { print(e.message) }
            try { app.createUser({user: "worker", pwd: "worker-dev-secret", roles: [{role: "workerUpdateDocuments", db: "app"}]}) } catch (e) { print(e.message) }
          '

      - name: cargo test ignored
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/
          # Stack Sentinel del job (T-08): el IT de failover resuelve el
          # master via estos sentinels y provoca SENTINEL FAILOVER.
          REDIS_SENTINEL_ADDRS: 127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381
          REDIS_MASTER_NAME: myprimary
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY: worker-dev
          S3_SECRET_KEY: worker-dev-secret
          MONGO_WORKER_URI: mongodb://worker:worker-dev-secret@127.0.0.1:27017/app?authSource=app&directConnection=true
          MONGO_TEST_ROOT_URI: mongodb://root:worker-dev-root@127.0.0.1:27017/?directConnection=true
        run: cargo test --all-features -- --ignored

  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: extraction-worker:ci
      - name: scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: extraction-worker:ci
          format: table
          severity: CRITICAL
          exit-code: '1'
