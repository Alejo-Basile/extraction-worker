name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La toolchain sale de rust-toolchain.toml (rustfmt + clippy incluidos)
      - name: install toolchain
        run: rustup show

      # Cache de dependencias (S0-P1-05)
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # S0-P3-02: clippy con warnings como error; unwrap/expect denegados
      # via [workspace.lints.clippy] en Cargo.toml.
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      # CI falla ante dependencias con vulnerabilidad conocida
      - name: cargo audit
        run: |
          cargo install --locked --force cargo-audit
          cargo audit --ignore RUSTSEC-2026-0258 --ignore RUSTSEC-2026-0346 --ignore RUSTSEC-2026-0347 --ignore RUSTSEC-2026-0348 --ignore RUSTSEC-2026-0349 --ignore RUSTSEC-2026-0382

      # Licencias y duplicados de dependencias
      - name: cargo deny
        run: |
          cargo install --locked --force cargo-deny
          cargo deny check bans licenses advisories

  integration:
    # Tests de integracion contra Redis real (S1-P3-04, S2-P3-07):
    # los #[ignore] corren solo aqui y en local (ver crates/worker/tests).
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: rustup show

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test ignored
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/
        run: cargo test --all-features -- --ignored
