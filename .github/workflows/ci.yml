name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La toolchain sale de rust-toolchain.toml (rustfmt + clippy incluidos)
      - name: install toolchain
        run: rustup show

      # Cache de dependencias (S0-P1-05)
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # S0-P3-02: clippy con warnings como error; unwrap/expect denegados
      # via [workspace.lints.clippy] en Cargo.toml.
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      # CI falla ante dependencias con vulnerabilidad conocida
      - name: cargo audit
        run: |
          cargo install --locked --force cargo-audit
          cargo audit --ignore RUSTSEC-2026-0258 --ignore RUSTSEC-2026-0346 --ignore RUSTSEC-2026-0347 --ignore RUSTSEC-2026-0348 --ignore RUSTSEC-2026-0349 --ignore RUSTSEC-2026-0382 --ignore RUSTSEC-2026-0384 --ignore RUSTSEC-2025-0012 --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2026-0192

      # Licencias y duplicados de dependencias
      - name: cargo deny
        run: |
          cargo install --locked --force cargo-deny
          cargo deny check bans licenses advisories

  integration:
    # Tests de integracion contra Redis y MinIO reales (S1-P3-04, S2-P3-01/07):
    # los #[ignore] corren solo aqui y en local (ver crates/worker/tests y
    # labs/dev-stack.md para el stack completo de desarrollo).
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        # MinIO retiro sus imagenes oficiales upstream; bitnamilegacy es la
        # ultima via publica (misma eleccion que labs/docker-compose.yml).
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: worker-dev
          MINIO_ROOT_PASSWORD: worker-dev-secret
          MINIO_DEFAULT_BUCKETS: raw-pdfs,extracted-txt
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: rustup show

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: start mongo (rs0 + auth + rol del worker, ADR-0006)
        run: |
          docker run -d --name mongo -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=root \
            -e MONGO_INITDB_ROOT_PASSWORD=worker-dev-root \
            mongo:7 \
            bash -c 'if [ ! -f /data/db/keyfile ]; then openssl rand -base64 75 > /data/db/keyfile; fi; chmod 400 /data/db/keyfile; exec docker-entrypoint.sh mongod --replSet rs0 --auth --keyFile /data/db/keyfile --bind_ip_all'
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet -u root -p worker-dev-root --authenticationDatabase admin --eval 'try { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}) } catch (e) { print(e.message) }' && break || sleep 2
          done
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet -u root -p worker-dev-root --authenticationDatabase admin --eval 'try { db.hello().isWritablePrimary } catch (e) { false }' | grep -q true && break || sleep 2
          done
          docker exec mongo mongosh --quiet -u root -p worker-dev-root --authenticationDatabase admin --eval '
            const app = db.getSiblingDB("app");
            try { app.createCollection("documents") } catch (e) { print(e.message) }
            try { app.createRole({role: "workerUpdateDocuments", privileges: [{resource: {db: "app", collection: "documents"}, actions: ["update"]}], roles: []}) } catch (e) { print(e.message) }
            try { app.createUser({user: "worker", pwd: "worker-dev-secret", roles: [{role: "workerUpdateDocuments", db: "app"}]}) } catch (e) { print(e.message) }
          '

      - name: cargo test ignored
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY: worker-dev
          S3_SECRET_KEY: worker-dev-secret
          MONGO_WORKER_URI: mongodb://worker:worker-dev-secret@127.0.0.1:27017/app?authSource=app&directConnection=true
          MONGO_TEST_ROOT_URI: mongodb://root:worker-dev-root@127.0.0.1:27017/?directConnection=true
        run: cargo test --all-features -- --ignored
