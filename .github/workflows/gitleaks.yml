# Escaneo de secretos en CI (S0-P1-04)
# Segunda capa de defensa: la primera es el pre-commit hook local
# (se instala con `gitleaks install` en cada clone, ver README).
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
