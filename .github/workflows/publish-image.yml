---
# Publica la imagen del worker en GitHub Container Registry (GHCR).
#
# Por que existe: la infraestructura despliega el worker fijando la imagen por
# digest, como `${EXTRACTION_WORKER_IMAGE}:${EXTRACTION_WORKER_TAG}@${DIGEST}`
# (ver infra `compose/docker-compose.yml`). Sin una imagen publicada no hay
# digest que fijar. Este workflow construye la imagen multi-arch y la sube a
# `ghcr.io/alejo-basile/extraction-worker`.
#
# El label OCI `org.opencontainers.image.revision` es lo que lee la infra con
# `docker inspect` para verificar que la revision desplegada coincide con el
# commit; por eso se fija explicitamente a `${{ github.sha }}`.
#
# Build por arquitectura en runners nativos (amd64 en ubuntu-latest, arm64 en
# ubuntu-24.04-arm) en lugar de emular arm64 con QEMU: evita la emulacion que
# hacia que el build superara los 30 minutos. Cada build sube su digest y el
# job `merge` arma el manifest list final con los tags.
name: publish-image

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Un push nuevo al mismo ref cancela la publicacion anterior todavia en curso.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      # Autenticacion contra GHCR con el token efimero del workflow.
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alejo-basile/extraction-worker
          labels: |
            org.opencontainers.image.title=extraction-worker
            org.opencontainers.image.description=Worker de extraccion de PDFs
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Cada arquitectura se construye en su runner nativo y se sube por digest.
      # `push-by-digest=true` evita tocar los tags hasta el merge final.
      - name: build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/alejo-basile/extraction-worker,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          cache-from: type=gha,scope=${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}

      # El digest (sin prefijo sha256:) se guarda como nombre de archivo vacio
      # para que el job de merge pueda recuperar todos los digests.
      - name: export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alejo-basile/extraction-worker
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=extraction-worker
            org.opencontainers.image.description=Worker de extraccion de PDFs
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Arma el manifest list multi-arch a partir de los digests por plataforma
      # y le aplica los tags finales.
      - name: create manifest list
        id: create
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $tags \
            $(printf 'ghcr.io/alejo-basile/extraction-worker@sha256:%s ' *)
          first_tag=$(jq -r '.tags[0] // empty' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # El digest final queda en el resumen del job para que un operador lo fije.
      - name: print image digest
        env:
          IMAGE_DIGEST: ${{ steps.create.outputs.digest }}
        run: |
          {
            echo "## Imagen publicada"
            echo ""
            echo '```'
            echo "ghcr.io/alejo-basile/extraction-worker@${IMAGE_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
