# cargo-deny: licencias y duplicados (S0-P3-02)

[bans]
multiple-versions = "warn"

[licenses]
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "0BSD", "BSL-1.0", "CC0-1.0", "UPL-1.0", "Unlicense"]

[advisories]
db-path = "~/.cargo/advisory-db"
