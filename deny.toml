# cargo-deny: licencias y duplicados (S0-P3-02)

[bans]
multiple-versions = "warn"

[licenses]
# CDLA-Permissive-2.0: licencia de datos (no de codigo) de webpki-root-certs
# (raices TLS de Mozilla usadas por rustls via object_store/reqwest). Variante
# permissive del CLA para datos: uso y redistribucion libres, sin copyleft.
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "0BSD", "BSL-1.0", "CC0-1.0", "UPL-1.0", "Unlicense", "CDLA-Permissive-2.0"]

[advisories]
db-path = "~/.cargo/advisory-db"
yanked = "warn"
ignore = [
    # h2 0.3.27 via actix-http 3.x. DoS de baja severidad aceptado: el listener
    # solo expone GET/HEAD de health/metrics y no procesa cuerpos. Se retira al
    # actualizar actix-http a una version que use h2 >= 0.4.16.
    "RUSTSEC-2026-0258",
    # backoff 0.4: sin mantenimiento, sin vulnerabilidad conocida. Se reemplaza
    # por backon o un helper interno en el proximo refactor del reconnect.
    "RUSTSEC-2025-0012",
    # instant 0.1.13: dependencia transitiva de backoff; desaparece al retirarlo.
    "RUSTSEC-2024-0384",
    # ttf-parser via lopdf (pdf-extract): unmaintained, sin vulnerabilidad conocida.
    "RUSTSEC-2026-0192",
    # actix-http 3.20.3 vulnerabilidades de parsing HTTP/1.1, se aceptan temporalmente
    # mientras se actualiza actix-web. El servicio solo expone endpoints de health/metrics.
    "RUSTSEC-2026-0552",
    "RUSTSEC-2026-0553",
    "RUSTSEC-2026-0554",
    # chrono/humantime unmaintained, sin alternativa inmediata en deps transitivas
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0542",
]
