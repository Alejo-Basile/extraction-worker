# Stack de desarrollo (F3a/F3b): MinIO + Mongo Replica Set.
# NO usar en produccion: credenciales de laboratorio, sin TLS, sin ACL.
#
# NOTA: MinIO retiro sus imagenes y binarios publicos (Docker Hub, quay,
# dl.min.io -> 410). Para el laboratorio se usan los builds congelados de
# Bitnami (bitnamilegacy), la ultima via publica disponible. El MinIO de
# staging/produccion lo aporta la infraestructura de P1, no este archivo.
#
# Uso:
#   cd labs && cp .env.example .env && docker compose up -d
#   (el archivo .env esta en .gitignore: nunca se commitea)

name: extraction-worker-dev

services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Buckets del pipeline (seccion 11.4); MinIO los crea privados.
      MINIO_DEFAULT_BUCKETS: raw-pdfs,extracted-txt
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    # Streams del pipeline (sin password en el lab; en prod, ACL por
    # usuario de aplicacion, S1-P1-07).
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mongo:
    # Replica Set rs0 con autenticacion (requisito del Change Stream del
    # relay, S1-P2-06; y del rol acotado del worker, ADR-0006). El usuario
    # root se crea al primer arranque via MONGO_INITDB_* (volumen vacio).
    image: mongo:7
    # rs0 + auth exige keyfile (regla de MongoDB). Se genera al primer
    # arranque dentro del volumen y se re-entra al entrypoint oficial para
    # que MONGO_INITDB_* cree el root.
    command: >
      bash -c '
      if [ ! -f /data/db/keyfile ]; then openssl rand -base64 75 > /data/db/keyfile; fi;
      chmod 400 /data/db/keyfile;
      exec docker-entrypoint.sh mongod --replSet rs0 --auth --keyFile /data/db/keyfile --bind_ip_all
      '
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u root -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'try { rs.status().ok } catch (e) { 0 }'"]
      interval: 5s
      timeout: 3s
      retries: 24

  mongo-init:
    # rs.initiate + coleccion documents + rol del worker con SOLO update
    # sobre documents (ADR-0006), via root. Idempotente: tolera rs0 ya
    # iniciado y coleccion/rol/usuario ya creados.
    image: mongo:7
    depends_on:
      mongo:
        condition: service_started
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_WORKER_PASSWORD: ${MONGO_WORKER_PASSWORD}
    restart: "no"
    entrypoint: >
      bash -c '
      for i in $$(seq 1 30); do
        mongosh --host mongo -u root -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "try { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}) } catch (e) { print(e.message) }" && break;
        sleep 2;
      done;
      for i in $$(seq 1 30); do
        mongosh --host mongo -u root -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "try { db.hello().isWritablePrimary } catch (e) { false }" | grep -q true && echo "primario listo" && break;
        sleep 2;
      done;
      mongosh --host mongo -u root -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "
        const app = db.getSiblingDB(\"app\");
        try { app.createCollection(\"documents\") } catch (e) { print(\"col: \" + e.message) }
        try { app.createRole({role: \"workerUpdateDocuments\", privileges: [{resource: {db: \"app\", collection: \"documents\"}, actions: [\"update\"]}], roles: []}) } catch (e) { print(\"role: \" + e.message) }
        try { app.createUser({user: \"worker\", pwd: \"$$MONGO_WORKER_PASSWORD\", roles: [{role: \"workerUpdateDocuments\", db: \"app\"}]}) } catch (e) { print(\"user: \" + e.message) }
        print(\"mongo init listo\");
      "
      '

volumes:
  minio-data:
  mongo-data:
