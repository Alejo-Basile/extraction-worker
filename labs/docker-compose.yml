# Stack de desarrollo (F3a/F3b): MinIO + Mongo Replica Set.
# NO usar en produccion: credenciales de laboratorio, sin TLS, sin ACL.
#
# NOTA: MinIO retiro sus imagenes y binarios publicos (Docker Hub, quay,
# dl.min.io -> 410). Para el laboratorio se usan los builds congelados de
# Bitnami (bitnamilegacy), la ultima via publica disponible. El MinIO de
# staging/produccion lo aporta la infraestructura de P1, no este archivo.
#
# Uso:
#   cd labs && cp .env.example .env && docker compose up -d
#   (el archivo .env esta en .gitignore: nunca se commitea)

name: extraction-worker-dev

services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Buckets del pipeline (seccion 11.4); MinIO los crea privados.
      MINIO_DEFAULT_BUCKETS: raw-pdfs,extracted-txt
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  mongo:
    # Replica Set rs0: requisito del Change Stream del relay (S1-P2-06) y
    # del readConcern majority. Se prepara aqui para F3b (S2-P3-08/09).
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { 0 }"]
      interval: 5s
      timeout: 3s
      retries: 24

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_started
    restart: "no"
    entrypoint: >
      bash -c '
      for i in $$(seq 1 30); do
        mongosh --host mongo --quiet --eval "rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]})" && echo "rs0 iniciado" && break;
        sleep 2;
      done
      '

volumes:
  minio-data:
  mongo-data:
